<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buison Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Personal Information Form</h1>
    <form>
        <label for="studentType">Student Type:</label>
        <select id="studentType" name="studentType">
            <option value="New student">New student</option>
            <option value="Transferee">Transferee</option>
        </select>
        <br><br>

        <label for="religion">Religion:</label>
        <select id="religion" name="religion">
            <option value="Roman Catholic">Roman Catholic</option>
            <option value="Christianity">Christianity</option>
            <option value="Islam">Islam</option>
            <option value="Hinduism">Hinduism</option>
            <option value="Buddhism">Buddhism</option>
            <option value="Judaism">Judaism</option>
            <option value="Atheism">Atheism</option>
            <option value="Agnosticism">Agnosticism</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label for="civilStatus">Civil Status:</label>
        <select id="civilStatus" name="civilStatus">
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Widowed">Widowed</option>
            <option value="Separated">Separated</option>
            <option value="Annulled">Annulled</option>
            <option value="Divorced">Divorced</option>
        </select>
        <br><br>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName"><br><br>

        <label for="middleName">Middle Name:</label>
        <input type="text" id="middleName" name="middleName"><br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName"><br><br>

        <label for="suffix">Suffix:</label>
        <input type="text" id="suffix" name="suffix"><br><br>

        <label for="contactNumber">Contact Number:</label>
        <input type="number" id="contactNumber" name="contactNumber"><br><br>

        <label for="birthdate">Birthdate:</label>
        <input type="date" id="birthdate" name="birthdate"><br><br>

        <label for="sex">Sex:</label>
        <select id="sex" name="sex">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="nationality">Nationality:</label>
        <input type="text" id="nationality" name="nationality"><br><br>

        <label for="country">Country:</label>
        <input type="text" id="country" name="country"><br><br>

        <label for="address">Complete Address:</label>
        <input type="text" id="address" name="address"><br><br>

        <label for="bloodType">Blood Type:</label>
        <select id="bloodType" name="bloodType">
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">
    </form>
    <script src="script.js"></script>
</body>
</html>
